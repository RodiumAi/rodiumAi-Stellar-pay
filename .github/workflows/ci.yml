name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm audit --audit-level high
      - run: pnpm checkout:build

  db-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm test:int
      - run: pnpm redis:start
      - run: pnpm test:redis

  stellar-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      - run: pnpm db:start
      - run: pnpm stellar:start
      - run: pnpm test:stellar
      - run: pnpm test:e2e
      - if: always()
        run: pnpm stellar:stop

  contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup reads contracts/rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: contracts
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny,cargo-audit,cargo-scout-audit
      # Scout compiles its detectors with a pinned nightly on first use (~15 min); cache both.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/git/checkouts/scout-audit-*
            ~/.rustup/toolchains/nightly-2025-09-18-*
          key: scout-detectors-0.3.17-${{ runner.os }}
      - name: stellar-cli
        env:
          STELLAR_CLI_VERSION: 28.1.0
          STELLAR_CLI_SHA256: c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462
        run: |
          curl -sSfL -o stellar.tgz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar.tgz" | sha256sum --check
          tar -xzf stellar.tgz stellar
          sudo install -m 755 stellar /usr/local/bin/stellar
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: stellar contract build
      - run: sha256sum target/wasm32v1-none/release/subscription.wasm
      - run: cargo deny check
      - run: cargo audit
      # rust-lang/rust-clippy renamed `master` to `main`, but the dylint 4.1.2 that Scout 0.3.17 builds
      # still clones it and checks out `master`. Serve that clone from a local mirror whose HEAD is
      # `master`. Drop this step once Scout ships a dylint that checks out `main`.
      - name: rust-clippy `master` for Scout
        run: |
          mirror="$RUNNER_TEMP/rust-clippy.git"
          git clone --quiet --bare https://github.com/rust-lang/rust-clippy "$mirror"
          git -C "$mirror" branch master main
          git -C "$mirror" symbolic-ref HEAD refs/heads/master
          git config --global url."$mirror".insteadOf https://github.com/rust-lang/rust-clippy
      # Blocks on critical/medium/minor; enhancements are explained in docs/security/contract-review.md.
      - run: |
          cargo scout-audit -o json --output-path scout.json
          python3 ../scripts/scout-gate.py scout.json

  contract-fuzz:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly-2025-09-18 --profile minimal
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-fuzz@0.13.2
      # Short smoke run per push; the ≥ 1 h run happens before each contract tag (plan §6).
      # The prebuilt cargo-fuzz defaults to musl, which has no sanitizer support.
      - run: cargo +nightly-2025-09-18 fuzz run charge_sequence --target x86_64-unknown-linux-gnu -- -max_total_time=120

  security-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner .
      # Code scanning (SARIF upload) needs GitHub Code Security, which the org does not
      # enable, so OSV and CodeQL fail the job directly instead of uploading.
      - name: osv-scanner
        env:
          OSV_VERSION: 2.6.0
          OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check
          chmod +x osv-scanner
          ./osv-scanner scan source --recursive .
      - name: semgrep
        run: |
          pipx run --spec semgrep==1.178.0 semgrep scan --config p/default --config p/typescript \
            --error --severity ERROR --metrics off

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          upload: never
          output: sarif
      # Blocks on high/critical findings (security-severity >= 7.0, context §16.1).
      - run: python3 scripts/sarif-gate.py sarif/*.sarif

  # Images (context §16.3): distroless, non-root, read-only, no shell; zero high/critical.
  containers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, signer, admin, backup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install trivy
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          curl -sSfL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum --check
          tar -xzf trivy.tgz trivy && sudo mv trivy /usr/local/bin/ && rm trivy.tgz
      - name: build
        run: |
          if [ "${{ matrix.app }}" = backup ]; then
            docker build -f infra/docker/Dockerfile.backup -t rp-backup:ci .
          else
            docker build -f infra/docker/Dockerfile --target ${{ matrix.app }} -t rp-${{ matrix.app }}:ci .
          fi
      # The backup job image needs a shell for pg_dump | age; the services must not have one.
      - name: hardening checks
        if: matrix.app != 'backup'
        run: ./scripts/check-image.sh rp-${{ matrix.app }}:ci
      - name: trivy (high/critical fail the build)
        run: |
          trivy image --no-progress --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            rp-${{ matrix.app }}:ci
      - name: SBOM (CycloneDX)
        run: trivy image --no-progress --format cyclonedx --output sbom-${{ matrix.app }}.cdx.json rp-${{ matrix.app }}:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.app }}
          path: sbom-${{ matrix.app }}.cdx.json

  # Kubernetes manifests: schema validation and misconfiguration scan.
  iac:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install trivy and kubeconform
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
          KUBECONFORM_VERSION: 0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -sSfL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum --check
          curl -sSfL -o kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum --check
          tar -xzf trivy.tgz trivy && tar -xzf kubeconform.tgz kubeconform
          sudo mv trivy kubeconform /usr/local/bin/
      - name: kubeconform
        run: |
          kubectl kustomize infra/k8s/overlays/staging > staging.yaml
          # SecretProviderClass is a CRD without a bundled schema.
          kubeconform -strict -summary -skip SecretProviderClass staging.yaml
      - name: trivy config (high/critical fail the build)
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL infra/
      - name: promtool (alert rules)
        env:
          PROM_VERSION: 3.15.0
          PROM_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
        run: |
          curl -sSfL -o prom.tgz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          echo "${PROM_SHA256}  prom.tgz" | sha256sum --check
          tar -xzf prom.tgz --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          python3 -m venv /tmp/py && /tmp/py/bin/pip install -q pyyaml==6.0.3
          /tmp/py/bin/python -c 'import sys, yaml; print(yaml.safe_dump(yaml.safe_load(open(sys.argv[1]))["spec"]))' \
            infra/observability/alerts.yaml > infra/observability/rules.yaml
          ./promtool check rules infra/observability/rules.yaml
          ./promtool test rules infra/observability/alerts.test.yaml

  # Default-deny network policies actually enforced (plan S10): kind's kindnet CNI.
  network-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install kind
        env:
          KIND_VERSION: 0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
        run: |
          curl -sSfL -o kind "https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum --check
          chmod +x kind && sudo mv kind /usr/local/bin/
      - run: kind create cluster --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --wait 120s
      - run: ./scripts/k8s/netpol-test.sh
