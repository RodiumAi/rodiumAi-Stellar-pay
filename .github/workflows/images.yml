name: images

# Publishes signed images from main (context §16.2–§16.3): GHCR, keyless cosign signature,
# SLSA build provenance and a CycloneDX SBOM attestation. A weekly rebuild picks up
# patched base layers; Trivy blocks anything with high/critical findings.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing (Fulcio) and provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, signer, admin, backup]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/rp-${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install trivy and cosign
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
          COSIGN_VERSION: 3.1.3
          COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        run: |
          curl -sSfL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum --check
          curl -sSfL -o cosign \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum --check
          tar -xzf trivy.tgz trivy && chmod +x cosign && sudo mv trivy cosign /usr/local/bin/
      - name: build
        run: |
          IMAGE_LC="${IMAGE,,}"
          echo "IMAGE_LC=$IMAGE_LC" >> "$GITHUB_ENV"
          if [ "${{ matrix.app }}" = backup ]; then file=infra/docker/Dockerfile.backup target=""; \
          else file=infra/docker/Dockerfile target="--target ${{ matrix.app }}"; fi
          docker build -f "$file" $target \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE_LC:${{ github.sha }}" .
      - if: matrix.app != 'backup'
        run: ./scripts/check-image.sh "$IMAGE_LC:${{ github.sha }}"
      - run: trivy image --no-progress --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE_LC:${{ github.sha }}"
      - name: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE_LC:${{ github.sha }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_LC:${{ github.sha }}")
          echo "DIGEST=${digest#*@}" >> "$GITHUB_ENV"
      - name: sign and attach SBOM
        run: |
          cosign sign --yes "$IMAGE_LC@$DIGEST"
          trivy image --no-progress --format cyclonedx --output sbom.cdx.json "$IMAGE_LC@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE_LC@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_LC }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      # Amazon ECR: the deploy registry. Runs only once the repository variables
      # AWS_ECR_ROLE_ARN and AWS_ECR_REGISTRY are set. GitHub signs in with OIDC, so no AWS keys
      # are stored in GitHub.
      - if: vars.AWS_ECR_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      - name: push to ECR and sign
        if: vars.AWS_ECR_ROLE_ARN != ''
        env:
          REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          # Repositories are tag-immutable: commit + run number is unique even for the weekly
          # rebuild of an unchanged commit. Deploy by digest.
          ecr="$REGISTRY/rodiumai/stellar-pay-${{ matrix.app }}"
          tag="${GITHUB_SHA::12}-${{ github.run_number }}"
          docker tag "$IMAGE_LC:${{ github.sha }}" "$ecr:$tag"
          docker push "$ecr:$tag"
          ecr_digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ecr:$tag" | grep "^$ecr@" | cut -d@ -f2)
          cosign sign --yes "$ecr@$ecr_digest"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$ecr@$ecr_digest"
          echo "### ${{ matrix.app }}: \`$ecr@$ecr_digest\` (tag \`$tag\`)" >> "$GITHUB_STEP_SUMMARY"
