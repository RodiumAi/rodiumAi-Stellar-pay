[workspace]
resolver = "3"
members = ["subscription"]

[workspace.package]
edition = "2024"
publish = false
license = "UNLICENSED"

# Context §14.4.
[profile.release]
overflow-checks = true
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
debug = 0
strip = "symbols"
debug-assertions = false
