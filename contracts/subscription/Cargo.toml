[package]
name = "subscription"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
# Testnet/Quickstart E2E only: lets plans charge every 60 s instead of every day.
# Never deployed to mainnet (scripts/contract/deploy.sh refuses).
test-short-intervals = []

[dependencies]
soroban-sdk = "=28.0.0"

[dev-dependencies]
soroban-sdk = { version = "=28.0.0", features = ["testutils"] }
proptest = "=1.11.0"
