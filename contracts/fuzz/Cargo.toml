[package]
name = "subscription-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
arbitrary = { version = "=1.3.2", features = ["derive"] }
soroban-sdk = { version = "=28.0.0", features = ["testutils"] }
subscription = { path = "../subscription" }

[[bin]]
name = "charge_sequence"
path = "fuzz_targets/charge_sequence.rs"
test = false
doc = false
bench = false

[workspace]
