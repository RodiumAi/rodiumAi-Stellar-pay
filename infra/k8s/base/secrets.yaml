# AWS Secrets Manager → files under /run/secrets (Secrets Store CSI driver, AWS provider).
# One secret per value; the object alias is the file name the app reads via FOO_FILE.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: rp-api
spec:
  provider: aws
  parameters:
    objects: |
      - { objectName: rodium-pay/api/API_HMAC_KEYS, objectType: secretsmanager, objectAlias: API_HMAC_KEYS }
      - { objectName: rodium-pay/api/CHECKOUT_TOKEN_KEY, objectType: secretsmanager, objectAlias: CHECKOUT_TOKEN_KEY }
      - { objectName: rodium-pay/shared/BLIND_INDEX_KEY, objectType: secretsmanager, objectAlias: BLIND_INDEX_KEY }
      - { objectName: rodium-pay/api/EXCHANGERATE_API_KEY, objectType: secretsmanager, objectAlias: EXCHANGERATE_API_KEY }
      - { objectName: rodium-pay/shared/UPSTASH_REDIS_REST_TOKEN, objectType: secretsmanager, objectAlias: UPSTASH_REDIS_REST_TOKEN }
      - { objectName: rodium-pay/api/DATABASE_URL_API, objectType: secretsmanager, objectAlias: DATABASE_URL_API }
      - { objectName: rodium-pay/shared/FIELD_DATA_KEYS, objectType: secretsmanager, objectAlias: FIELD_DATA_KEYS }
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: rp-worker
spec:
  provider: aws
  parameters:
    objects: |
      - { objectName: rodium-pay/worker/WEBHOOK_SIGNING_KEY_PEM, objectType: secretsmanager, objectAlias: WEBHOOK_SIGNING_KEY_PEM }
      - { objectName: rodium-pay/worker/DATABASE_URL_WORKER, objectType: secretsmanager, objectAlias: DATABASE_URL_WORKER }
      - { objectName: rodium-pay/worker/DATABASE_URL_WORKER_SESSION, objectType: secretsmanager, objectAlias: DATABASE_URL_WORKER_SESSION }
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: rp-signer
spec:
  provider: aws
  parameters:
    objects: |
      - { objectName: rodium-pay/signer/KEEPER_SECRET, objectType: secretsmanager, objectAlias: KEEPER_SECRET }
