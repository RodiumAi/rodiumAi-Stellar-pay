packages:
  - apps/*
  - packages/*

# Supply-chain rules (context §16.2).
# 20160 minutes = 14 days: freshly published versions cannot be installed.
minimumReleaseAge: 20160
strictPeerDependencies: true
# Lifecycle scripts are blocked unless the package is listed here.
onlyBuiltDependencies: []
# Accepted audit findings until the fix clears minimumReleaseAge; then bump and drop the entry.
# follow-redirects 1.16.1 via @stellar/stellar-sdk > axios (API, worker, signer). StelPay sends no
# auth headers or credentials through the SDK, so the redirect leak does not apply. Fix 1.16.2
# clears the 14-day release age on 2026-11-08.
auditConfig:
  ignoreGhsas:
    - GHSA-mrwp-f3q8-3g9p
