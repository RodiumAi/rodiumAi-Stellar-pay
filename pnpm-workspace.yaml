packages:
  - apps/*
  - packages/*

# Supply-chain rules (context §16.2).
# 20160 minutes = 14 days: freshly published versions cannot be installed.
minimumReleaseAge: 20160
strictPeerDependencies: true
# Lifecycle scripts are blocked unless the package is listed here.
onlyBuiltDependencies: []
# Accepted advisories. undici reaches the tree only through jsdom in unit tests (never in
# an image); the fix (8.12.2) clears minimumReleaseAge on 2026-10-29, then drop this entry.
auditConfig:
  ignoreGhsas:
    - GHSA-2m5v-pch6-74hx
    - GHSA-4w7w-5xrc-9h26
    - GHSA-qrxm-fqhp-jwvm
    - GHSA-xjj6-f33q-929c
