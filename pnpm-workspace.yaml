packages:
  - apps/*
  - packages/*

# Supply-chain rules (context §16.2).
# 20160 minutes = 14 days: freshly published versions cannot be installed.
minimumReleaseAge: 20160
strictPeerDependencies: true
# Lifecycle scripts are blocked unless the package is listed here.
onlyBuiltDependencies: []
# minimatch < 11.0.1: glob DoS (GHSA-g3hv-75wg-m249). Dev only (eslint, typescript-eslint), which
# still ask for ^10; drop this once they accept 11.
overrides:
  minimatch: ^11.0.1
